<script>
  let IS_ADMIN_MODE = false;
  let ADMIN_CODE_SESSION = ""; 
  let CONFIG_CACHE = null;
  let PENDING_CONFIRM_ACTION = null;

  function initConfigView() {
      loadConfigData();
  }

  function switchConfigTab(tabName, clickedEl) {
      document.querySelectorAll('.cfg-menu-item').forEach(el => el.classList.remove('active'));
      if(clickedEl) clickedEl.classList.add('active');
      document.querySelectorAll('.cfg-section').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if(target) target.classList.add('active');
  }

  function loadConfigData() {
      google.script.run.withSuccessHandler(data => {
          CONFIG_CACHE = data;
          renderAll(data);
          toggleAdminMode(false);
          setDirty(false);
      }).withFailureHandler(err => {
          showNotionToast("Erreur: " + err.message, "error");
      }).getConfigData();
  }

  // --- RENDU LOGIQUE METIER ---
  
  function renderAll(data) {
      renderRolesByGroup(data.roles);
      
// CHARGEMENT RECUEILS
      const cRec = document.getElementById('recueilsContainer');
      if(cRec) {
          cRec.innerHTML = "";
          if(!data.recueils || data.recueils.length === 0) {
              cRec.innerHTML = '<div class="text-center py-4 text-muted small">Aucun recueil</div>';
          } else {
              data.recueils.forEach(r => {
                  cRec.innerHTML += buildRecueilHtml(r.id, r.nom, r.prefixe);
              });
          }
      }

      const cNoms = document.getElementById('nomsContainer');      if(cNoms) {
          cNoms.innerHTML = "";
          if(!data.noms || data.noms.length === 0) {
              cNoms.innerHTML = '<div class="text-center py-4 text-muted small">Vide</div>';
          } else {
              data.noms.forEach((n, idx) => {
                  // On récupère le texte si c'est un objet, ou directement si c'est une string (compatibilité)
                  let nId = n.id || "";
                  let nName = n.nom || n; 
                  cNoms.innerHTML += `
                    <div class="cfg-item cascade-item" style="animation-delay: ${idx * 0.01}s">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:28px; height:28px; font-size:10px;">${getInitials(nName)}</div>
                        <input type="text" class="cfg-input ms-2 nom-input" data-id="${nId}" value="${nName}" placeholder="Nom Prénom" oninput="setDirty(true)">
                        <i class="bi bi-trash3 text-muted opacity-25 btn-action-danger ms-auto" onclick="confirmRemoveItem(this)"></i>
                    </div>`;
              });
          }
      }

      safeSetValue('pdfFolderId', data.pdfFolderId);
      safeSetValue('pdfTemplateId', data.pdfTemplateId);
      safeSetValue('slidesTemplateSalleId', data.slidesTemplateSalleId);
      safeSetValue('slidesFolderId', data.slidesFolderId);
      safeSetValue('respCodeInput', data.respCode);
      
      // CHARGEMENT DES SLIDES MAPPINGS
      const cMap = document.getElementById('slideMappingContainer');
      if(cMap) {
          cMap.innerHTML = "";
          if(!data.slideMappings || data.slideMappings.length === 0) {
              cMap.innerHTML = '<div class="text-center py-4 text-muted small fst-italic">Aucune règle définie</div>';
          } else {
              const groups = {};
              data.slideMappings.forEach(m => {
                  const key = (m.titre_mg + "|" + m.titre_fr).toLowerCase();
                  if (!groups[key]) groups[key] = { id: m.id, mg: m.titre_mg, fr: m.titre_fr, tags: [] };
                  groups[key].tags.push(m.tag);
              });
              
              Object.values(groups).forEach(g => {
                  cMap.innerHTML += buildSlideMappingGroupHtml(g.id, g.mg, g.fr, g.tags);
              });
          }
      }

      const cVal = document.getElementById('valideursContainer');
      if(cVal) {
          cVal.innerHTML = "";
          if(!data.valideurs || data.valideurs.length === 0) {
              cVal.innerHTML = '<div class="text-center py-4 text-muted small">Aucun valideur</div>';
          } else {
              data.valideurs.forEach(v => {
                  cVal.innerHTML += `
                    <div class="cfg-item mb-1 border-bottom val-item">
                        <i class="bi bi-person-check-fill text-success"></i>
                        <input type="text" class="cfg-input fw-bold ms-2 validation-name" data-id="${v.id || ""}" value="${v.nom}" placeholder="Nom" oninput="setDirty(true)">
                        <input type="password" class="cfg-input code-badge text-center text-danger validation-code" value="${v.code}" placeholder="Code" style="width:60px;" oninput="setDirty(true)" autocomplete="new-password">
                        <i class="bi bi-trash3 text-muted opacity-25 btn-action-danger" onclick="confirmRemoveItem(this)"></i>
                    </div>`;
              });
          }
      }
  }

  function safeSetValue(id, val) {
      const el = document.getElementById(id);
      if(el) el.value = val || "";
  }

  // --- RÔLES DYNAMIQUES (CORRIGÉ : PAS DE TYPES FORCÉS) ---
  function renderRolesByGroup(roles) {
      const container = document.getElementById('rolesGridContainer');
      if(!container) return;
      container.innerHTML = "";

      const groups = {};
      
      // 1. Scan des données réelles
      if(roles) {
          roles.forEach(r => {
              let type = r.type ? r.type.charAt(0).toUpperCase() + r.type.slice(1) : "Autre";
              if(!groups[type]) groups[type] = [];
              groups[type].push(r);
          });
      }

      // 2. Ordre d'affichage (Esthétique uniquement, n'ajoute pas de données)
      const sortOrder = ["Liturgie", "Musique", "Technique", "Accueil"];
      const allTypes = Object.keys(groups);
      
      allTypes.sort((a, b) => {
          const idxA = sortOrder.indexOf(a);
          const idxB = sortOrder.indexOf(b);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          if (idxA !== -1) return -1;
          if (idxB !== -1) return 1;
          return a.localeCompare(b);
      });

      // 3. Rendu
      allTypes.forEach((gName, gIdx) => {
          const groupRoles = groups[gName];
          
          // STRICT : Si vide et pas "Autre", on n'affiche pas.
          if ((!groupRoles || groupRoles.length === 0) && gName !== "Autre") return;

          let roleItemsHtml = "";
          if(groupRoles) {
              groupRoles.forEach(r => {
                  // On passe l'ID, le Nom et le Type
                  roleItemsHtml += buildRoleItemHtml(r.id, r.name, gName);
              });
          }

          const card = document.createElement('div');
          card.className = "role-group-card cascade-item";
          card.style.animationDelay = (gIdx * 0.1) + "s";
          
          let colorClass = "text-secondary";
          if(gName === "Liturgie") colorClass = "text-primary";
          if(gName === "Musique") colorClass = "text-success";
          if(gName === "Technique") colorClass = "text-danger";

          // ID unique pour injection directe sans rechargement
          const groupId = "group-body-" + gName.replace(/\s+/g, '-');

          card.innerHTML = `
              <div class="role-group-header ${colorClass}">
                  <span>${gName}</span>
                  <span class="badge bg-light text-dark border role-count-badge">${groupRoles ? groupRoles.length : 0}</span>
              </div>
              <div class="role-group-body p-0" id="${groupId}">
                  ${roleItemsHtml}
                  <button class="btn-add-row btn-add" onclick="addRole('${gName}')">
                      <i class="bi bi-plus-lg"></i> Ajouter un rôle
                  </button>
              </div>
          `;
          container.appendChild(card);
      });
  }

  // HTML Helper pour une ligne
  function buildRoleItemHtml(id, name, type) {
      return `
        <div class="cfg-item role-item">
            <input type="text" class="cfg-input fw-medium role-name-input" data-id="${id || ""}" value="${name || ""}" placeholder="Nom rôle" oninput="setDirty(true)">
            <input type="hidden" class="role-type-input" value="${type}">
            <i class="bi bi-trash3 text-muted opacity-25 btn-action-danger ms-auto" onclick="confirmRemoveItem(this)"></i>
        </div>`;
  }

  function buildRecueilHtml(id, nom, prefixe) {
      return `
        <div class="cfg-item recueil-item">
            <input type="hidden" class="rec-id" value="${id || ""}">
            <i class="bi bi-book-half text-primary opacity-50 ms-2"></i>
            <input type="text" class="cfg-input fw-medium rec-nom flex-grow-1 ms-2" value="${nom || ""}" placeholder="Nom du recueil" oninput="setDirty(true)">
            <input type="text" class="cfg-input text-secondary text-center rec-prefixe border rounded bg-light" style="width: 70px;" value="${prefixe || ""}" placeholder="Préfixe" oninput="setDirty(true)">
            <i class="bi bi-trash3 text-muted opacity-25 btn-action-danger ms-2" onclick="confirmRemoveItem(this)"></i>
        </div>`;
  }

  function addRecueil() {
      if (!IS_ADMIN_MODE) return;
      const container = document.getElementById('recueilsContainer');
      if (container.querySelector('.text-center')) container.innerHTML = "";
      const div = document.createElement('div'); 
      div.className = "animation-fade-in";
      div.innerHTML = buildRecueilHtml("", "", "");
      container.appendChild(div);
      setDirty(true);
  }

  function getInitials(name) { return name ? name.substring(0, 2).toUpperCase() : ".."; }
  
  function togglePassVisibility(icon, inputId) {
      const input = document.getElementById(inputId);
      if (input.type === "password") { input.type = "text"; icon.classList.replace("bi-eye-slash", "bi-eye"); } 
      else { input.type = "password"; icon.classList.replace("bi-eye", "bi-eye-slash"); }
  }

  // --- ACTIONS (ADD/REMOVE) ---
  
  function confirmRemoveItem(btn) {
      if (!IS_ADMIN_MODE) return;
      openConfirmModal("Suppression", "Voulez-vous vraiment supprimer cet élément ?", () => {
          const item = btn.closest('.cfg-item');
          if(item) {
              const groupCard = item.closest('.role-group-card');
              item.remove();
              if (groupCard) updateGroupCount(groupCard);
          }
          setDirty(true);
      });
  }

  // CORRECTION : AJOUT FLUIDE SANS RECHARGEMENT
  function addRole(targetType) {
      if (!IS_ADMIN_MODE) return;
      
      const type = targetType || "Autre";
      
      // Update cache
      if(!CONFIG_CACHE.roles) CONFIG_CACHE.roles = [];
      CONFIG_CACHE.roles.push({name: "", type: type});
      
      const groupId = 'group-body-' + type.replace(/\s+/g, '-');
      const container = document.getElementById(groupId);
      
      if (container) {
          // Injection DOM
          const btnAdd = container.querySelector('.btn-add-row');
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = buildRoleItemHtml("", "", type); // ID vide pour un nouveau
          const newItem = tempDiv.firstElementChild;
          
          // Insert Before Button
          container.insertBefore(newItem, btnAdd);
          
          // Focus
          const inp = newItem.querySelector('input[type="text"]');
          if(inp) inp.focus();
          
          // Update Count
          const card = container.closest('.role-group-card');
          updateGroupCount(card);
      } else {
          // Si le groupe n'existe pas encore (ex: 1er ajout dans Autre), on recharge tout
          renderRolesByGroup(CONFIG_CACHE.roles);
      }
      
      setDirty(true);
  }

  function updateGroupCount(card) {
      if (!card) return;
      const countBadge = card.querySelector('.role-count-badge');
      const items = card.querySelectorAll('.role-item');
      if (countBadge) countBadge.innerText = items.length;
  }

  function addNom() {
      if (!IS_ADMIN_MODE) return;
      const container = document.getElementById('nomsContainer');
      const div = document.createElement('div'); 
      div.className = "cfg-item nom-item animation-fade-in";
      div.innerHTML = `<div class="bg-gray-200 text-secondary rounded-circle d-flex align-items-center justify-content-center" style="width:28px; height:28px; font-size:10px;">?</div><input type="text" class="cfg-input ms-2 nom-input" data-id="" placeholder="Nouveau participant" oninput="setDirty(true)"><i class="bi bi-trash3 text-muted opacity-25 btn-action-danger ms-auto" onclick="confirmRemoveItem(this)"></i>`;
      container.prepend(div);
      const inp = div.querySelector('input');
      if(inp) inp.focus();
      setDirty(true);
  }

  function addValideur() {
      if (!IS_ADMIN_MODE) return;
      const container = document.getElementById('valideursContainer');
      const div = document.createElement('div'); div.className = "cfg-item val-item mb-1 border-bottom animation-fade-in";
      div.innerHTML = `<i class="bi bi-person-check-fill text-success"></i><input type="text" class="cfg-input fw-bold ms-2 validation-name" data-id="" placeholder="Nom" oninput="setDirty(true)"><input type="password" class="cfg-input code-badge text-center text-danger validation-code" placeholder="Code" style="width:60px;" oninput="setDirty(true)" autocomplete="new-password"><i class="bi bi-trash3 text-muted opacity-25 btn-action-danger" onclick="confirmRemoveItem(this)"></i>`;
      container.appendChild(div);
      const inp = div.querySelector('input');
      if(inp) inp.focus();
      setDirty(true);
  }

  // --- RECHERCHE SLIDES MAPPING ---
  function filterSlideMappings(query) {
      const q = query.toLowerCase().trim();
      document.querySelectorAll('.slide-map-parent').forEach(el => {
          const mg = (el.querySelector('.map-mg').value || "").toLowerCase();
          const fr = (el.querySelector('.map-fr').value || "").toLowerCase();
          if (mg.includes(q) || fr.includes(q)) el.style.display = 'block';
          else el.style.display = 'none';
      });
  }

  // --- UI : SLIDES MAPPING (GROUPÉ) ---
  function buildSlideTagHtml(tagValue) {
      return `
      <div class="d-flex align-items-center gap-2 mb-1 slide-map-tag-row">
          <i class="bi bi-grip-vertical text-muted opacity-25 cursor-pointer"></i>
          <div class="input-group input-group-sm flex-grow-1">
              <span class="input-group-text bg-light text-muted fw-bold border-secondary border-opacity-25">[</span>
              <input type="text" class="form-control form-control-sm map-tag fw-bold text-dark border-secondary border-opacity-25" placeholder="SLD_EXEMPLE" value="${(tagValue || "").replace(/^\[|\]$/g, '')}" oninput="setDirty(true)">
              <span class="input-group-text bg-light text-muted fw-bold border-secondary border-opacity-25">]</span>
          </div>
          <i class="bi bi-x-circle text-danger opacity-50 hover-opacity-100 cursor-pointer" onclick="removeSlideTag(this)"></i>
      </div>`;
  }

  function removeSlideTag(btn) {
      if (!IS_ADMIN_MODE) return;
      const row = btn.closest('.slide-map-tag-row');
      const parent = row.closest('.slide-map-parent');
      row.remove();
      setDirty(true);
      if (parent.querySelectorAll('.slide-map-tag-row').length === 0) {
          addSlideTag(parent.querySelector('.btn-add-tag'));
      }
  }

  function addSlideTag(btnElement) {
      if (!IS_ADMIN_MODE) return;
      const container = btnElement.closest('.slide-map-parent').querySelector('.slide-tags-container');
      const div = document.createElement('div');
      div.innerHTML = buildSlideTagHtml("");
      container.appendChild(div.firstElementChild);
      setDirty(true);
  }

  function buildSlideMappingGroupHtml(id, titreMg, titreFr, tagsArray) {
      let tagsHtml = "";
      if (tagsArray && tagsArray.length > 0) {
          tagsArray.forEach(t => tagsHtml += buildSlideTagHtml(t));
      } else {
          tagsHtml = buildSlideTagHtml("");
      }

      return `
      <div class="cfg-item mb-3 border rounded slide-map-parent p-3 flex-column align-items-stretch bg-white shadow-sm">
          <input type="hidden" class="map-id" value="${id || ""}">
          <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="small text-primary fw-bold text-uppercase" style="font-size:10px; letter-spacing: 0.5px;">
                 <i class="bi bi-lightning-charge-fill me-1"></i> Déclencheur
              </label>
              <i class="bi bi-trash3 text-muted opacity-25 btn-action-danger cursor-pointer" onclick="confirmRemoveItem(this)" title="Supprimer tout le groupe"></i>
          </div>
          <div class="row g-2 mb-3 pb-3 border-bottom">
              <div class="col-6"><input type="text" class="form-control form-control-sm map-mg fw-bold" placeholder="Titre MG Exact..." value="${titreMg || ""}" oninput="setDirty(true)"></div>
              <div class="col-6"><input type="text" class="form-control form-control-sm map-fr text-secondary fst-italic" placeholder="Titre FR Exact..." value="${titreFr || ""}" oninput="setDirty(true)"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="small text-muted fw-bold text-uppercase" style="font-size:10px;">Générer ces Slides :</label>
              <button class="btn btn-sm btn-light border py-0 px-2 text-secondary btn-add-tag" style="font-size:10px;" onclick="addSlideTag(this)">+ Ajouter Slide</button>
          </div>
          <div class="slide-tags-container ps-2 border-start border-2 border-secondary border-opacity-25">
              ${tagsHtml}
          </div>
      </div>`;
  }

  function addSlideMappingGroup() {
      if (!IS_ADMIN_MODE) return;
      const container = document.getElementById('slideMappingContainer');
      if (container.querySelector('.text-center')) container.innerHTML = ""; 
      
      const div = document.createElement('div');
      div.className = "animation-fade-in";
      div.innerHTML = buildSlideMappingGroupHtml("", "", "", []);
      
      container.prepend(div.firstElementChild);
      setDirty(true);
      setTimeout(() => { container.querySelector('.map-mg').focus(); }, 50);
  }

  // --- MODALS ---
  
  function openNewTypeModal() {
      if (!IS_ADMIN_MODE) return;
      const m = document.getElementById('newTypeModal');
      const o = document.getElementById('configOverlay');
      if (m && m.parentElement !== document.body) document.body.appendChild(m);
      if (o && o.parentElement !== document.body) document.body.appendChild(o);
      m.style.display = 'block'; o.style.display = 'block';
      const input = document.getElementById('newTypeInput');
      input.value = "";
      setTimeout(() => input.focus(), 100);
  }
  function closeNewTypeModal() {
      document.getElementById('newTypeModal').style.display = 'none';
      checkCloseOverlay();
  }
  function confirmNewType() {
      const val = document.getElementById('newTypeInput').value.trim();
      if(val) {
          const typeFormatted = val.charAt(0).toUpperCase() + val.slice(1);
          closeNewTypeModal();
          // Ici on recharge car c'est une nouvelle structure
          addRole(typeFormatted);
      }
  }

  function openConfirmModal(title, msg, actions) {
      document.getElementById('cfgConfirmTitle').innerText = title;
      document.getElementById('cfgConfirmMsg').innerText = msg;
      
      const actionsContainer = document.getElementById('cfgConfirmActions');
      actionsContainer.innerHTML = "";
      
      if (Array.isArray(actions)) {
          actions.forEach(act => {
              const btn = document.createElement('button');
              btn.className = "btn " + (act.class || "btn-light border");
              btn.innerText = act.label;
              btn.onclick = () => { if (act.action) act.action(); if (act.close !== false) closeConfirmModal(); };
              actionsContainer.appendChild(btn);
          });
      } else {
          const confirmBtn = document.createElement('button');
          confirmBtn.className = "btn btn-dark";
          confirmBtn.innerText = "Confirmer";
          confirmBtn.onclick = () => { if(actions) actions(); closeConfirmModal(); };
          const cancelBtn = document.createElement('button');
          cancelBtn.className = "btn btn-link text-secondary";
          cancelBtn.innerText = "Annuler";
          cancelBtn.onclick = closeConfirmModal;
          actionsContainer.appendChild(confirmBtn);
          actionsContainer.appendChild(cancelBtn);
      }
      
      const m = document.getElementById('cfgConfirmModal');
      const o = document.getElementById('configOverlay');
      if (m && m.parentElement !== document.body) document.body.appendChild(m);
      if (o && o.parentElement !== document.body) document.body.appendChild(o);
      m.style.display = 'block'; o.style.display = 'block';
  }

  function closeConfirmModal() {
      document.getElementById('cfgConfirmModal').style.display = 'none';
      PENDING_CONFIRM_ACTION = null;
      checkCloseOverlay();
  }
  
  function checkCloseOverlay() {
      const modals = ['adminAuthModal', 'cfgConfirmModal', 'newTypeModal'];
      let anyOpen = false;
      modals.forEach(id => {
          const el = document.getElementById(id);
          if(el && el.style.display === 'block') anyOpen = true;
      });
      if(!anyOpen) document.getElementById('configOverlay').style.display = 'none';
  }
  
  function closeAllAdminModals() {
      closeAdminModal();
      closeConfirmModal();
      closeNewTypeModal();
  }

  // --- ADMIN AUTH & LOCK ---
  function askAdminCode() {
      const modal = document.getElementById('adminAuthModal');
      const overlay = document.getElementById('configOverlay');
      if (modal && modal.parentElement !== document.body) document.body.appendChild(modal);
      if (overlay && overlay.parentElement !== document.body) document.body.appendChild(overlay);
      if(modal) modal.style.display = 'block';
      if(overlay) overlay.style.display = 'block';
      const input = document.getElementById('adminCodeInput');
      if(input) { input.value = ""; setTimeout(() => input.focus(), 100); }
  }
  function closeAdminModal() {
      document.getElementById('adminAuthModal').style.display = 'none';
      checkCloseOverlay();
  }
  function submitAdminAuth() {
      const inp = document.getElementById('adminCodeInput');
      const code = inp.value;
      const btn = document.querySelector('#adminAuthModal .btn-dark');
      const originalTxt = btn.innerText;
      
      if (!code) { inp.classList.add('shake-error'); setTimeout(() => inp.classList.remove('shake-error'), 500); return; }
      
      btn.innerText = "..."; btn.disabled = true;
      google.script.run.withSuccessHandler(isValid => {
          btn.innerText = originalTxt; btn.disabled = false;
          if (isValid) {
              ADMIN_CODE_SESSION = code;
              toggleAdminMode(true);
              closeAdminModal();
              showNotionToast("Mode Admin activé", "success");
          } else {
              inp.classList.add('shake-error');
              inp.value = ""; inp.focus();
              setTimeout(() => inp.classList.remove('shake-error'), 500);
          }
      }).checkAdminCode(code);
  }

  function toggleAdminMode(isAdmin) {
      IS_ADMIN_MODE = isAdmin;
      const grid = document.getElementById('configGrid');
      const status = document.getElementById('lockStatusText');
      
      if (isAdmin) {
          grid.classList.remove('is-locked');
          status.innerHTML = `<span class="text-success fw-bold"><i class="bi bi-unlock-fill me-1"></i>MODE ÉDITION</span>`;
          document.getElementById('btnUnlock').classList.add('hidden');
          document.getElementById('btnLock').classList.remove('hidden');
          document.getElementById('btnSaveAll').classList.remove('hidden');
          
          // Déverrouille les boutons spécifiques
          document.querySelectorAll('.btn-add-tag').forEach(b => b.style.display = 'block');
      } else {
          grid.classList.add('is-locked');
          status.innerHTML = `<i class="bi bi-lock-fill me-1"></i>Lecture seule`;
          document.getElementById('btnUnlock').classList.remove('hidden');
          document.getElementById('btnLock').classList.add('hidden');
          document.getElementById('btnSaveAll').classList.add('hidden');
          ADMIN_CODE_SESSION = ""; 
          const respInp = document.getElementById('respCodeInput');
          if(respInp) { respInp.type = "password"; }
          
          // Verrouille les boutons spécifiques
          document.querySelectorAll('.btn-add-tag').forEach(b => b.style.display = 'none');
      }
  }

  function attemptLock() {
      if (APP_IS_DIRTY) {
          openConfirmModal(
              "Modifications non enregistrées", 
              "Vous avez des changements en attente. Que voulez-vous faire ?", 
              [
                  {
                      label: "Enregistrer & Verrouiller",
                      class: "btn-success text-white",
                      action: () => saveAllConfig(true)
                  },
                  {
                      label: "Ne pas enregistrer",
                      class: "btn-danger text-white",
                      action: () => {
                          setDirty(false);
                          loadConfigData();
                          toggleAdminMode(false);
                      }
                  },
                  {
                      label: "Annuler",
                      class: "btn-light border text-secondary",
                      action: () => {}
                  }
              ]
          );
      } else {
          toggleAdminMode(false);
      }
  }

  // --- SAUVEGARDE ROBUSTE ---
  function saveAllConfig(lockAfter = false) {
      if(!IS_ADMIN_MODE || !ADMIN_CODE_SESSION) return;
      
      const btn = document.getElementById('btnSaveAll');
      const originalText = btn.innerHTML; // Déclaré une seule fois !
      
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>...`; 
      btn.disabled = true;

      // 0. Recueils
      const recueils = [];
      document.querySelectorAll('.recueil-item').forEach(el => {
          const rId = el.querySelector('.rec-id').value;
          const rNom = el.querySelector('.rec-nom').value.trim();
          const rPref = el.querySelector('.rec-prefixe').value.trim();
          if (rNom) recueils.push({ id: rId, nom: rNom, prefixe: rPref });
      });

      // 1. Roles
      const roles = [];
      document.querySelectorAll('.role-item').forEach(el => {
          const nameInput = el.querySelector('.role-name-input');
          const typeInput = el.querySelector('.role-type-input');
          if(nameInput && nameInput.value) {
              roles.push({
                  id: nameInput.getAttribute('data-id') || "", 
                  name: nameInput.value.trim(), 
                  type: typeInput ? typeInput.value : "Autre"
              });
          }
      });

      // 2. Noms
      const noms = [];
      const nomContainer = document.getElementById('nomsContainer');
      if (nomContainer) {
          nomContainer.querySelectorAll('.nom-input').forEach(inp => {
              if(inp.value && inp.value.trim() !== "") {
                  noms.push({
                      id: inp.getAttribute('data-id') || "",
                      nom: inp.value.trim()
                  });
              }
          });
      }

      // 3. Valideurs
      const valideurs = [];
      const valContainer = document.getElementById('valideursContainer');
      if (valContainer) {
          valContainer.querySelectorAll('.val-item').forEach(el => {
              const nameInp = el.querySelector('.validation-name');
              const codeInp = el.querySelector('.validation-code');
              if(nameInp && codeInp && nameInp.value) {
                  valideurs.push({
                      id: nameInp.getAttribute('data-id') || "",
                      nom: nameInp.value.trim(), 
                      code: codeInp.value
                  });
              }
          });
      }

      // 4. Slides Mapping (Aplatissement pour la BDD)
      const slideMappings = [];
      document.querySelectorAll('.slide-map-parent').forEach(el => {
          const mId = el.querySelector('.map-id').value;
          const mMg = el.querySelector('.map-mg').value.trim();
          const mFr = el.querySelector('.map-fr').value.trim();
          
          if (mMg !== "" || mFr !== "") {
              el.querySelectorAll('.map-tag').forEach(tagEl => {
                  let mTag = tagEl.value.trim();
                  if (mTag !== "") {
                      if (!mTag.startsWith('[')) mTag = '[' + mTag;
                      if (!mTag.endsWith(']')) mTag = mTag + ']';
                      slideMappings.push({ id: mId, titre_mg: mMg, titre_fr: mFr, tag: mTag.toUpperCase() });
                  }
              });
          }
      });

      const payload = {
          recueils: recueils,
          roles: roles,
          noms: noms,
          valideurs: valideurs,
          slideMappings: slideMappings,
          respCode: document.getElementById('respCodeInput').value,
          pdfFolderId: document.getElementById('pdfFolderId').value,
          pdfTemplateId: document.getElementById('pdfTemplateId').value,
          slidesTemplateSalleId: document.getElementById('slidesTemplateSalleId').value,
          slidesFolderId: document.getElementById('slidesFolderId').value
      };
      
      google.script.run.withSuccessHandler(msg => {
          btn.innerHTML = `<i class="bi bi-check-lg me-2"></i>OK`;
          setTimeout(() => { 
              btn.innerHTML = originalText; btn.disabled = false;
              setDirty(false);
              showNotionToast("Configuration enregistrée !", "success");
              if (lockAfter) {
                  toggleAdminMode(false);
                  loadConfigData();
              }
          }, 800);
      }).withFailureHandler(err => {
          showNotionToast("Erreur: " + err.message, "error");
          btn.innerHTML = originalText; btn.disabled = false;
      }).saveConfigFull(ADMIN_CODE_SESSION, payload);
  }
</script>
