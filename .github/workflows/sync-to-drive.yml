name: Sync Codebase to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rclone
        run: sudo apt-get install -y rclone

      - name: Configure rclone
        run: |
          mkdir -p /home/runner/.config/rclone
          
          # On génère la config UNIQUEMENT avec ton Token et l'ID du dossier
          cat <<EOF > /home/runner/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          token = ${{ secrets.GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF
      - name: Mirror Repository to Google Drive
        run: |
          rclone sync . gdrive: \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --drive-use-trash=false \
            -v
