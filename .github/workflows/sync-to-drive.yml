name: Sync Codebase to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Bundle Codebase into a Single Markdown File
        env:
          TZ: Europe/Paris
        run: |
          echo "# Codebase Complète" > codebase_total.md
          echo "Dernière synchronisation : $(date +'%Y-%m-%d %H:%M:%S')" >> codebase_total.md
          echo "" >> codebase_total.md
          
          find . -type f \( -name "*.gs" -o -name "*.html" -o -name "appsscript.json" \) ! -path "*/.*" | while read -r file; do
            echo "## ========================================" >> codebase_total.md
            echo "### FICHIER : $file" >> codebase_total.md
            echo "## ========================================" >> codebase_total.md
            
            ext="${file##*.}"
            if [ "$ext" = "gs" ]; then ext="javascript"; fi
            
            echo '```'$ext >> codebase_total.md
            cat "$file" >> codebase_total.md
            echo "" >> codebase_total.md
            echo '```' >> codebase_total.md
            echo "" >> codebase_total.md
          done

      - name: Mirror Repository to Google Drive
        env:
          # Configuration absolue de rclone sous ton identité applicative
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copy codebase_total.md gdrive: \
            --drive-allow-import-name-change \
            -v
