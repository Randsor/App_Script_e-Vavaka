name: Sync Codebase to Google Drive

on:
  push:
    branches:
      - main # Ou 'master' selon ta branche principale
  workflow_dispatch: # Permet de lancer la synchro manuellement via l'onglet Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rclone
        run: sudo apt-get install -y rclone

      - name: Configure rclone
        run: |
          mkdir -p /home/runner/.config/rclone
          # On écrit la clé JSON dans un chemin absolu en dur
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > /home/runner/.config/rclone/sa.json
          
          # On génère le fichier de configuration avec le bon chemin absolu
          cat <<EOF > /home/runner/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_credentials = /home/runner/.config/rclone/sa.json
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Mirror Repository to Google Drive
        run: |
          rclone sync . gdrive: \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --drive-use-trash=false \
            -v
