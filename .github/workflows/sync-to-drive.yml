name: Sync Codebase to Google Drive via GAS API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bundle Codebase into a Single Markdown File
        env:
          TZ: Europe/Paris
        run: |
          echo "# Codebase Complète" > codebase_total.md
          echo "Dernière synchronisation : $(date +'%Y-%m-%d %H:%M:%S')" >> codebase_total.md
          echo "" >> codebase_total.md
          
          find . -type f \( -name "*.gs" -o -name "*.html" -o -name "appsscript.json" \) ! -path "*/.*" | while read -r file; do
            echo "## ========================================" >> codebase_total.md
            echo "### FICHIER : $file" >> codebase_total.md
            echo "## ========================================" >> codebase_total.md
            
            ext="${file##*.}"
            if [ "$ext" = "gs" ]; then ext="javascript"; fi
            
            echo '```'$ext >> codebase_total.md
            cat "$file" >> codebase_total.md
            echo "" >> codebase_total.md
            echo '```' >> codebase_total.md
            echo "" >> codebase_total.md
          done

      - name: Send Bundle to Google Drive API
        run: |
          # 1. jq lit le fichier directement depuis le disque (-Rs) et génère un fichier JSON physique (payload.json)
          # Cela évite d'injecter le texte dans la ligne de commande.
          jq -Rs '{content: .}' codebase_total.md > payload.json
          
          # 2. curl prend le fichier payload.json directement sur le disque via le préfixe '@'
          # L'option --data-binary est critique pour préserver les sauts de ligne du code.
          curl -L -X POST "${{ secrets.GAS_WEBAPP_URL }}?token=${{ secrets.GAS_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
            
          # 3. Nettoyage du fichier temporaire
          rm payload.json
