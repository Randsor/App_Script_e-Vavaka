name: Sync Codebase to Google Drive

on:
  push:
    branches:
      - main # Ou 'master' selon ta branche principale

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rclone
        run: sudo apt-get install -y rclone

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          # On écrit la clé JSON du compte de service dans un fichier temporaire
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > ~/.config/rclone/sa.json
          
          # On génère le fichier de configuration rclone à la volée
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_credentials = ~/.config/rclone/sa.json
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Mirror Repository to Google Drive
        run: |
          # rclone sync fait un miroir exact. 
          # Les fichiers supprimés sur Git seront supprimés sur Drive.
          # On exclut les dossiers système de Git et de GitHub Actions pour nettoyer le Drive.
          rclone sync . gdrive: \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --drive-use-trash=false \
            -v
