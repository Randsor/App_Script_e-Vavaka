<script>
// --- CONFIG & STATE ---
const VIEW_MODE_MASTER = 'MASTER'; // Vue Verticale (Par Rôles)
const VIEW_MODE_PIVOT = 'PIVOT';   // Vue Horizontale (Par Date)
const VIEW_MODE_MOBILE = 'MOBILE';

let CURRENT_VIEW = VIEW_MODE_PIVOT; // DÉFAUT = PAR DATE (Horizontal)
let ACTIVE_FILTER_ROLES = []; // Vide = Tout sélectionné
let FILTERED_ROLES = [];      
let PLANNING_DATA = []; 
let ROLES_CONFIG = []; 
let NAMES_DB = [];
let NEXT_CULT_INDEX = -1;
let NEXT_CULT_DATE_STR = "";

// PAGINATION
let PAGINATION = {
    MASTER: { start: 0, visible: 5 },
    PIVOT: { start: 0, visible: 6 }
};

let IS_FULL_LOADED = false;
let HAS_SCROLLED_ONCE = false;

// --- INIT ---
function initPlanningView() {
    movePopupsToBody();
    
    // Initialisation pagination
    setTimeout(() => {
        calculateVisibleColumns('MASTER');
        calculateVisibleColumns('PIVOT');
    }, 50);
    
    if(PLANNING_DATA.length > 0) {
        refreshAllViews();
        return;
    }
    
    PLANNING_DATA = [];
    IS_FULL_LOADED = false;
    HAS_SCROLLED_ONCE = false;
    
    if (window.innerWidth < 768) CURRENT_VIEW = VIEW_MODE_MOBILE;
    
    const skel = document.getElementById('plSkeleton');
    if(skel) skel.classList.remove('hidden');
    
    window.addEventListener('resize', handleResize);
    document.addEventListener('keydown', handleKeyboardNav);

    // Chargement rapide (-30j / +90j)
    google.script.run
        .withSuccessHandler(onFastDataLoaded)
        .withFailureHandler(err => {
            alert("Erreur: " + err.message);
            if(skel) skel.classList.add('hidden');
        })
        .getPlanningMatrixData(-30, 90);

    // Gestionnaire global fermeture
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeAllPopups();
    });
    const overlay = document.getElementById('popupOverlay');
    if (overlay) overlay.addEventListener('click', closeAllPopups);
}

function onFastDataLoaded(response) {
    processDataChunk(response);
    const skel = document.getElementById('plSkeleton');
    if(skel) skel.classList.add('hidden');
    
    // Lancement chargement fond (-1 an / +2 ans)
    setTimeout(() => {
        if(!IS_FULL_LOADED) {
            google.script.run.withSuccessHandler(onBackgroundDataLoaded).getPlanningMatrixData(-365, 730);
        }
    }, 1500);
}

function onBackgroundDataLoaded(response) {
    const containerMaster = document.getElementById('viewContainerMaster');
    
    // Mémorisation position Verticale (Scroll Pixel)
    let anchorUid = null;
    let anchorOffset = 0;
    
    if (CURRENT_VIEW === VIEW_MODE_MASTER && containerMaster) {
        const rows = containerMaster.querySelectorAll('.pl-row');
        for (let row of rows) {
            if (row.offsetTop + row.offsetHeight > containerMaster.scrollTop) {
                anchorUid = row.getAttribute('data-uid');
                anchorOffset = containerMaster.scrollTop - row.offsetTop;
                break;
            }
        }
    }

    // Mémorisation position Horizontale (Index Pagination)
    let pivotFirstEventUid = null;
    if (CURRENT_VIEW === VIEW_MODE_PIVOT && PLANNING_DATA.length > 0) {
        const currentStartIndex = PAGINATION.PIVOT.start;
        if(PLANNING_DATA[currentStartIndex]) {
            const evt = PLANNING_DATA[currentStartIndex];
            pivotFirstEventUid = evt.date + "_" + evt.heure;
        }
    }

    // --- RECHARGEMENT ---
    processDataChunk(response);
    IS_FULL_LOADED = true;
    
    // --- RESTAURATION ---
    
    // A. Vue Verticale
    if (CURRENT_VIEW === VIEW_MODE_MASTER && anchorUid && containerMaster) {
        refreshAllViews(true); // Silent Mode
        const newRow = containerMaster.querySelector(`.pl-row[data-uid="${anchorUid}"]`);
        if (newRow) containerMaster.scrollTop = newRow.offsetTop + anchorOffset;
    }
    
    // B. Vue Horizontale
    else if (CURRENT_VIEW === VIEW_MODE_PIVOT) {
        if (pivotFirstEventUid) {
            const newIndex = PLANNING_DATA.findIndex(e => (e.date + "_" + e.heure) === pivotFirstEventUid);
            if (newIndex > -1) PAGINATION.PIVOT.start = newIndex;
        }
        refreshAllViews(true); // Silent Mode
    } 
    else {
        refreshAllViews(true);
    }
}

function processDataChunk(response) {
    if (!ROLES_CONFIG.length) {
        ROLES_CONFIG = response.roles || [];
        FILTERED_ROLES = [...ROLES_CONFIG];
    }
    if (!NAMES_DB.length) NAMES_DB = response.noms || [];
    
    const newEvents = response.events || [];
    const currentKeys = new Set(PLANNING_DATA.map(e => e.date + "-" + e.heure));
    let added = false;
    
    newEvents.forEach(evt => {
        const key = evt.date + "-" + evt.heure;
        if (!currentKeys.has(key)) { PLANNING_DATA.push(evt); added = true; }
    });
    
    if (added) {
        PLANNING_DATA.sort((a,b) => a.dateObj - b.dateObj);
        
        const now = new Date().setHours(0,0,0,0);
        NEXT_CULT_INDEX = PLANNING_DATA.findIndex(e => e.dateObj >= now);
        if (NEXT_CULT_INDEX === -1) NEXT_CULT_INDEX = PLANNING_DATA.length - 1; 
        
        if (NEXT_CULT_INDEX > -1) {
            NEXT_CULT_DATE_STR = PLANNING_DATA[NEXT_CULT_INDEX].date;
        }
        
        calculateVisibleColumns('MASTER');
        calculateVisibleColumns('PIVOT');
        
        // Premier rendu (non silencieux)
        if (!IS_FULL_LOADED) refreshAllViews(false);
        
        if (!HAS_SCROLLED_ONCE && NEXT_CULT_INDEX > -1) {
            setTimeout(forceScrollToNext, 200);
            HAS_SCROLLED_ONCE = true;
        }
    }
}

// --- VIEW MANAGEMENT ---

function getCenterVisibleEventIndex() {
    const container = document.getElementById('viewContainerMaster');
    if (!container) return 0;
    const containerRect = container.getBoundingClientRect();
    const centerY = containerRect.top + (containerRect.height / 2);
    const rows = container.querySelectorAll('.pl-row');
    let closestIndex = 0; let minDiff = Infinity;
    rows.forEach((row) => {
        const rect = row.getBoundingClientRect();
        const rowCenter = rect.top + (rect.height / 2);
        const diff = Math.abs(centerY - rowCenter);
        if (diff < minDiff) {
            minDiff = diff;
            const idParts = row.id.split('-');
            if (idParts.length === 3) closestIndex = parseInt(idParts[2], 10);
        }
    });
    return closestIndex;
}

function switchPlanningMode(mode) {
    const switcher = document.getElementById('viewSwitcher');
    if(switcher) switcher.setAttribute('data-active', mode);
    
    const masterEl = document.getElementById('viewContainerMaster');
    const pivotEl = document.getElementById('viewContainerPivot');
    const skel = document.getElementById('plSkeleton');

    let targetEventIndex = -1;
    if (mode === VIEW_MODE_MASTER && CURRENT_VIEW === VIEW_MODE_PIVOT) {
        const currentStart = PAGINATION.PIVOT.start;
        targetEventIndex = currentStart + Math.floor((PAGINATION.PIVOT.visible || 6) / 2);
    } else if (mode === VIEW_MODE_PIVOT && CURRENT_VIEW === VIEW_MODE_MASTER) {
        targetEventIndex = getCenterVisibleEventIndex();
        PAGINATION.PIVOT.start = Math.max(0, targetEventIndex - 2);
    }

    CURRENT_VIEW = mode;

    // 1. Masquer et afficher le squelette
    if(skel) skel.classList.remove('hidden');
    if(masterEl) masterEl.classList.add('pl-view-hidden');
    if(pivotEl) pivotEl.classList.add('pl-view-hidden');

    setTimeout(() => {
        const targetEl = (mode === 'MASTER') ? masterEl : pivotEl;
        
        if (targetEl) {
            targetEl.scrollLeft = 0; 
            targetEl.classList.remove('pl-view-hidden');
            
            // Animation
            targetEl.classList.remove('view-animate-enter');
            void targetEl.offsetWidth; 
            targetEl.classList.add('view-animate-enter');
            
            // Rendu
            calculateVisibleColumns(mode);
            if (mode === 'MASTER') renderMasterView(targetEl);
            else renderPivotView(targetEl);
            
            // --- CORRECTION DU SAUT (SCROLL MANUEL) ---
            if (targetEventIndex > -1 && mode === 'MASTER') {
                const row = document.getElementById(`row-master-${targetEventIndex}`);
                if (row) {
                    // Calcul mathématique précis pour centrer sans faire sauter la page
                    // Position de la ligne - Moitié de l'écran + Moitié de la ligne
                    targetEl.scrollTop = row.offsetTop - (targetEl.clientHeight / 2) + (row.clientHeight / 2);
                }
            } else if (mode === 'MASTER') {
                forceScrollToNext();
            }
            
            // 2. Cacher le squelette
            if(skel) skel.classList.add('hidden');
        }
    }, 50); 
}

function refreshAllViews(silent = false) {
    if (CURRENT_VIEW === VIEW_MODE_MOBILE) {
        renderMobileView(document.getElementById('mobileViewport'));
        return;
    }
    const masterEl = document.getElementById('viewContainerMaster');
    const pivotEl = document.getElementById('viewContainerPivot');

    if (silent) {
        // Mode Silencieux
        if (masterEl) masterEl.classList.remove('view-animate-enter');
        if (pivotEl) pivotEl.classList.remove('view-animate-enter');

        if (CURRENT_VIEW === VIEW_MODE_MASTER) {
            calculateVisibleColumns('MASTER');
            renderMasterView(masterEl);
        } else {
            calculateVisibleColumns('PIVOT');
            renderPivotView(pivotEl);
        }
    } else {
        // Mode Standard
        switchPlanningMode(CURRENT_VIEW);
    }
}

// --- RENDERERS ---

function calculateVisibleColumns(mode) {
    const containerId = (mode === 'MASTER') ? 'viewContainerMaster' : 'viewContainerPivot';
    const container = document.getElementById(containerId);
    const containerW = (container && container.clientWidth > 0) ? container.clientWidth : document.querySelector('.pl-wrapper').clientWidth;
    const dateColW = 220; const userColW = 200;
    const available = containerW - dateColW - 40;
    const count = Math.floor(available / userColW);
    PAGINATION[mode].visible = Math.max(1, count);
}

function navColumns(dir) {
    const mode = CURRENT_VIEW;
    if(mode === VIEW_MODE_MOBILE) return;
    const state = PAGINATION[mode];
    const totalItems = (mode === 'MASTER') ? FILTERED_ROLES.length : PLANNING_DATA.length;
    const maxStart = Math.max(0, totalItems - state.visible);
    state.start += (dir * state.visible);
    if(state.start < 0) state.start = 0;
    if(state.start > maxStart) state.start = maxStart;
    
    if(mode === 'MASTER') renderMasterView(document.getElementById('viewContainerMaster'));
    else renderPivotView(document.getElementById('viewContainerPivot'));
}

// Vue Par Rôles (Verticale) -> Dates en Lignes
function renderMasterView(container) {
    if(!container) return;
    const state = PAGINATION.MASTER;
    const visibleRoles = FILTERED_ROLES.slice(state.start, state.start + state.visible);
    
    const table = document.createElement('table'); table.className = 'pl-table';
    let thead = `<thead class="pl-thead"><tr><th class="th-corner">CULTES</th>`;
    visibleRoles.forEach(r => {
        const iconClass = getRoleIconClass(r.name);
        const colorClass = getRoleHeaderClass(r.name);
        thead += `<th class="th-col ${colorClass}" style="text-align:center;"><i class="bi ${iconClass} me-2 opacity-50"></i>${r.name}</th>`;
    });
    thead += `</tr></thead>`; table.innerHTML = thead;
    
    const tbody = document.createElement('tbody');
    let lastYear = null;

    PLANNING_DATA.forEach((evt, rowIdx) => {
        const dObj = new Date(evt.dateObj);
        const currentYear = dObj.getFullYear();
        if (lastYear && currentYear !== lastYear) {
            const trSep = document.createElement('tr'); trSep.className = 'year-row';
            trSep.innerHTML = `<td colspan="${1+visibleRoles.length}"><div class="year-divider"><span class="year-label">${currentYear}</span><div class="year-line"></div></div></td>`;
            tbody.appendChild(trSep);
        }
        lastYear = currentYear;

        const tr = document.createElement('tr'); tr.className = 'pl-row'; tr.id = `row-master-${rowIdx}`;
        tr.setAttribute('data-uid', `${evt.date}_${evt.heure}`);
        const isNextGroup = (evt.date === NEXT_CULT_DATE_STR);
        if (isNextGroup) tr.classList.add('is-next');
        if (rowIdx < NEXT_CULT_INDEX && !isNextGroup) tr.classList.add('is-past');
        
        const day = dObj.toLocaleDateString('fr-FR', {day:'numeric'});
        const weekday = dObj.toLocaleDateString('fr-FR', {weekday:'short'}).replace('.', '');
        const month = dObj.toLocaleDateString('fr-FR', {month:'short'}).replace('.', '');
        const titleSafe = (evt.titre || "").replace(/'/g, "\\'");

        const dateHtml = `<td class="td-date hover-trigger"><div class="date-layout" style="cursor:default;"><div class="d-calendar"><div class="d-weekday">${weekday}</div><div class="d-day">${day}</div><div class="d-month">${month}</div></div><div class="d-separator"></div><div class="d-info"><div class="d-title hover-bg rounded px-1 cursor-pointer" onclick="event.stopPropagation(); openEditTitleModal('${evt.date}', '${evt.heure}', '${titleSafe}')" title="Modifier le titre">${titleSafe}</div>
        <div class="d-time hover-bg rounded px-1 cursor-pointer" onclick="event.stopPropagation(); openEditTimeModal('${evt.date}', '${evt.heure}')" title="Modifier l'heure">${evt.heure}</div>
        </div></div><div class="trash-wrapper"><i class="bi bi-trash3 btn-action-danger cursor-pointer" style="font-size: 14px;" onclick="window.TARGET_SLOT={d:'${evt.date}',h:'${evt.heure}'}; confirmDeleteSlot();" title="Supprimer"></i></div></td>`;
        
        let rowHtml = dateHtml;
        visibleRoles.forEach(role => {
            const val = evt.assignments[role.name] || "";
            const cssClass = val ? "user-cell filled" : "user-cell";
            let inner = val ? 
            // CAS REMPLI
            `<span class="text-truncate" style="flex:1;">${val}</span>
            <div class="hover-actions-group">
                <div class="btn-circle-action" title="Modifier" style="width:24px; height:24px;"><i class="bi bi-pencil-fill" style="font-size:10px;"></i></div>
            </div>` 
            : 
            // CAS VIDE (Strictement identique à PivotView)
            `<div class="hover-actions-group" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                <div class="btn-circle-action add" style="width:24px; height:24px;"><i class="bi bi-plus-lg"></i></div>
            </div>`;
                    rowHtml += `<td onclick="openNamePopup(this, '${evt.date}', '${evt.heure}', '${role.name}', '${val}')" class="hover-trigger"><div class="${cssClass}">${inner}</div></td>`;
                });
        tr.innerHTML = rowHtml; tbody.appendChild(tr);
    });
    table.appendChild(tbody); container.innerHTML = ""; container.appendChild(table);
}

// Vue Par Date (Horizontale) -> RETOUR AUX COMPOSANTS MASTER (Standardisés)
function renderPivotView(container) {
    if(!container) return;
    const state = PAGINATION.PIVOT;
    const visibleEvents = PLANNING_DATA.slice(state.start, state.start + state.visible);
    const now = new Date().setHours(0,0,0,0);
    
    const table = document.createElement('table'); table.className = 'pl-table';
    
    // --- EN-TÊTE (inchangé, ton code validé) ---
    let thead = `<thead class="pl-thead"><tr><th class="th-corner" style="vertical-align:middle; padding-left:24px; background:#fff; border-bottom:1px solid #E2E8F0;">RÔLES</th>`;
    
    visibleEvents.forEach((evt, idx) => {
        const realIdx = state.start + idx;
        const dObj = new Date(evt.dateObj);
        
        const day = dObj.toLocaleDateString('fr-FR', {day:'numeric'});
        const month = dObj.toLocaleDateString('fr-FR', {month:'short'}).toUpperCase().replace('.','');
        const weekday = dObj.toLocaleDateString('fr-FR', {weekday:'short'}).toUpperCase().replace('.','');
        
        const isPast = evt.dateObj < now;
        const isNext = (evt.date === NEXT_CULT_DATE_STR);
        const titreCulte = evt.titre || "Culte";
        
        let thClass = "th-col hover-trigger"; 
        let wrapperStyle = "";
        
        if (isPast) {
            wrapperStyle = "opacity: 0.5; filter: grayscale(100%);";
        } else if (isNext) {
            thClass += " th-next-active"; 
        }

        thead += `
        <th class="${thClass}" id="col-pivot-${realIdx}" style="padding: 12px; vertical-align: top;">
            <div class="hover-actions-group" style="position:absolute; top:6px; right:6px; z-index:10;">
                <i class="bi bi-trash3-fill btn-action-danger cursor-pointer text-secondary opacity-50" 
                   onclick="window.TARGET_SLOT={d:'${evt.date}',h:'${evt.heure}'}; confirmDeleteSlot();" 
                   title="Supprimer ce culte" style="font-size: 14px;"></i>
            </div>
            <div style="${wrapperStyle} display:flex; flex-direction:column; align-items:center; gap:4px;">
                <div class="date-inline-row">
                    <span style="font-size:10px; font-weight:800; color:#DC2626;">${weekday}</span>
                    <span style="font-size:18px; font-weight:800; color:#1E293B;">${day}</span>
                    <span style="font-size:10px; font-weight:700; color:#94A3B8;">${month}</span>
                </div>
                <div onclick="openEditTimeModal('${evt.date}', '${evt.heure}')" style="background:#F1F5F9; color:#475569; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; cursor:pointer; transition:0.2s;" onmouseover="this.style.background='#E2E8F0'" onmouseout="this.style.background='#F1F5F9'">${evt.heure}</div>
                <div onclick="openEditTitleModal('${evt.date}', '${evt.heure}', '${(evt.titre||"").replace(/'/g, "\\'")}')" class="hover-bg rounded px-1 cursor-pointer" style="font-size:11px; font-weight:700; color:#0F172A; text-transform:uppercase; margin-top:2px; text-align:center; line-height:1.2; white-space:normal;">${titreCulte}</div>
            </div>
        </th>`;
    });
    thead += `</tr></thead>`; table.innerHTML = thead;
    
    const tbody = document.createElement('tbody');
    
    // --- CORPS ---
    FILTERED_ROLES.forEach(role => {
        const tr = document.createElement('tr'); tr.className = 'pl-row';
        
        const colorClass = getRoleHeaderClass(role.name);
        const iconClass = getRoleIconClass(role.name);
        
        tr.innerHTML = `
        <td class="td-date" style="padding:0; height: 50px;">
            <div class="${colorClass}" style="width:100%; height:100%; display:flex; align-items:center; padding:0 12px; border-right:1px solid rgba(0,0,0,0.05);">
                <i class="bi ${iconClass} me-2 opacity-50" style="font-size:12px;"></i>
                <div style="font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:0.3px; opacity:0.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${role.name}</div>
            </div>
        </td>`;
        
        visibleEvents.forEach(evt => {
            const isPast = evt.dateObj < now;
            const isNext = (evt.date === NEXT_CULT_DATE_STR);
            const val = evt.assignments[role.name] || "";
            
            let cellStyle = "";
            let innerContent = "";
            
            if (isPast) {
                cellStyle = "background-color: #FAFAFA !important; filter: grayscale(100%); opacity: 0.5; pointer-events: none;";
                innerContent = val ? `<span class="text-truncate" style="font-size:12px; color:#64748B;">${val}</span>` : "";
            } else {
                if (isNext) cellStyle = "background-color: #fff; border-left: 1px solid rgba(0,0,0,0.04); border-right: 1px solid rgba(0,0,0,0.04);";
                
                if (val) {
                    // --- CAS 1 : NOM REMPLI ---
                    // On utilise .user-cell.filled + .hover-actions-group pour le crayon
                    // Le crayon est positionné en absolu à droite (right: 8px)
                    innerContent = `
                        <span class="text-truncate fw-medium" style="font-size:12px; width:100%; text-align:center;">${val}</span>
                        <div class="hover-actions-group" style="position:absolute; right:10px; top:50%; transform:translateY(-50%);">
                            <div class="btn-circle-action" title="Modifier" style="width:24px; height:24px;"><i class="bi bi-pencil-fill" style="font-size:10px;"></i></div>
                        </div>`;
                } else {
                    // --- CAS 2 : VIDE (BOUTON +) ---
                    // On utilise EXACTEMENT la structure du Master : .hover-actions-group + .btn-circle-action.add
                    // L'opacité est gérée par le CSS global via la classe hover-trigger du TD
                    innerContent = `
                        <div class="hover-actions-group" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                            <div class="btn-circle-action add" style="width:24px; height:24px;"><i class="bi bi-plus-lg"></i></div>
                        </div>`;
                }
            }

            // IMPORTANT : class="hover-trigger" sur le TD est la clé pour que le CSS Global fonctionne
            tr.innerHTML += `<td style="${cellStyle}" onclick="openNamePopup(this, '${evt.date}', '${evt.heure}', '${role.name}', '${val}')" class="hover-trigger"><div class="user-cell">${innerContent}</div></td>`;
        });
        tbody.appendChild(tr);
    });
    table.appendChild(tbody); container.innerHTML = ""; container.appendChild(table);
}

function renderMobileView(container) {
    const start = Math.max(0, NEXT_CULT_INDEX - 2);
    const end = Math.min(PLANNING_DATA.length, NEXT_CULT_INDEX + 10);
    const subset = PLANNING_DATA.slice(start, end);
    let html = "";
    subset.forEach(evt => {
        const isNext = (PLANNING_DATA.indexOf(evt) === NEXT_CULT_INDEX);
        const dObj = new Date(evt.dateObj);
        const dateStr = dObj.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
        const borderClass = isNext ? "border-primary" : "";
        html += `
        <div class="card mb-3 shadow-sm border-0 ${borderClass}" style="border-radius:12px;">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                    <div class="fw-bold text-capitalize">${dateStr}</div>
                    <div class="badge bg-light text-dark border">${evt.heure}</div>
                </div>
                ${isNext ? '<div class="badge bg-primary mb-3">Prochain</div>' : ''}
                <div class="d-flex flex-column gap-2">`;
        ROLES_CONFIG.forEach(role => {
            const val = evt.assignments[role.name];
            if(val) html += `<div class="d-flex justify-content-between small"><span class="text-muted">${role.name}</span><span class="fw-bold">${val}</span></div>`;
        });
        html += `</div></div></div>`;
    });
    container.innerHTML = html;
}

// --- UTILS & ACTIONS ---

function forceScrollToNext() {
    if (!NEXT_CULT_DATE_STR && NEXT_CULT_INDEX === -1) return;
    let targetIdx = -1;
    if (NEXT_CULT_DATE_STR) targetIdx = PLANNING_DATA.findIndex(e => e.date === NEXT_CULT_DATE_STR);
    else targetIdx = NEXT_CULT_INDEX;
    
    if (targetIdx > -1) {
        if (CURRENT_VIEW === VIEW_MODE_MASTER) {
            const row = document.getElementById(`row-master-${targetIdx}`);
            if(row) row.scrollIntoView({behavior: 'smooth', block: 'start'});
        } else if (CURRENT_VIEW === VIEW_MODE_PIVOT) {
            PAGINATION.PIVOT.start = targetIdx;
            const pivotEl = document.getElementById('viewContainerPivot');
            if(pivotEl) renderPivotView(pivotEl);
        }
    }
}

function handleResize() { 
    calculateVisibleColumns('MASTER');
    calculateVisibleColumns('PIVOT');
    if(CURRENT_VIEW === VIEW_MODE_MASTER) renderMasterView(document.getElementById('viewContainerMaster'));
    else if(CURRENT_VIEW === VIEW_MODE_PIVOT) renderPivotView(document.getElementById('viewContainerPivot'));
}

function closeAllPopups() {
    document.querySelectorAll('.notion-popup, .notion-dialog, .dropdown-menu, .offcanvas-custom').forEach(e => {
        e.style.display='none';
        e.classList.remove('open');
    });
    
    const overlay = document.getElementById('popupOverlay');
    if(overlay) overlay.style.display='none';
}

function movePopupsToBody() {
    // Liste exhaustive de tous les éléments flottants
    const ids = [

function toggleFilterMenu(btnElement) {
    const menu = document.getElementById('slotActionMenu');
    if (menu.style.display === 'block' && menu.classList.contains('filter-mode')) return;

    const groups = {};
    const allRoleNames = ROLES_CONFIG.map(r => r.name);
    const currentSelection = (ACTIVE_FILTER_ROLES.length === 0) ? allRoleNames : ACTIVE_FILTER_ROLES;
    const isAllSelected = (currentSelection.length === allRoleNames.length);

    ROLES_CONFIG.forEach(r => {
        let type = r.type ? r.type.trim() : "Autre";
        if(type === "") type = "Autre";
        type = type.charAt(0).toUpperCase() + type.slice(1);
        if(!groups[type]) groups[type] = [];
        groups[type].push(r.name);
    });

    const colorMap = { 'LITURGIE': '#2563EB', 'MUSIQUE': '#15803D', 'TECHNIQUE': '#C2410C', 'TRADUCTION': '#7C3AED', 'SECRETAIRE': '#0F766E', 'ACCUEIL': '#4338CA' };

    let html = `<div class="filter-dropdown-panel" onclick="event.stopPropagation()"><div class="filter-header"><span class="fw-bold small text-dark"><i class="bi bi-funnel-fill me-2 text-secondary"></i>Filtres</span><button class="btn btn-sm btn-light border py-0 px-2" id="btnFilterToggleAll" style="font-size:11px;" onclick="filterAction('TOGGLE_ALL')">${isAllSelected ? 'Tout décocher' : 'Tout cocher'}</button></div><div class="filter-body custom-scrollbar">`;

    Object.keys(groups).sort().forEach(type => {
        const roles = groups[type];
        const baseClass = getTypeColorClassFromType(type.toUpperCase());
        const textClass = baseClass.replace('th-type-', 'text-filter-');
        let hexColor = "#6B7280";
        for(let key in colorMap) if(type.toUpperCase().includes(key)) { hexColor = colorMap[key]; break; }
        
        let iconClass = "circle-fill";
        if(type.toUpperCase().includes('LITURG')) iconClass = "book";
        else if(type.toUpperCase().includes('MUSI')) iconClass = "music-note-beamed";
        else if(type.toUpperCase().includes('TECH')) iconClass = "sliders";
        else if(type.toUpperCase().includes('TRAD')) iconClass = "translate";

        html += `<div class="filter-group-header" onclick="filterAction('TOGGLE_GROUP', {groupRoles: '${roles.join(',')}'})"><div class="d-flex align-items-center gap-2 ${textClass}"><i class="bi bi-${iconClass}" style="font-size:12px;"></i><span>${type}</span></div></div>`;

        roles.forEach(roleName => {
            const isChecked = currentSelection.includes(roleName);
            // AJOUT !important pour forcer la couleur de la checkbox
            html += `<label class="filter-role-item"><input type="checkbox" class="filter-chk custom-chk me-2" value="${roleName}" ${isChecked ? 'checked' : ''} style="accent-color: ${hexColor} !important; transform: scale(1.1); cursor: pointer;" onchange="filterAction('TOGGLE_ROLE', {role: '${roleName}'})"><span class="text-truncate small ${textClass}" style="font-weight:500;">${roleName}</span></label>`;
        });
        html += `<div class="mb-2"></div>`;
    });
    html += `</div></div>`;

    if(menu) {
        menu.innerHTML = html;
        menu.classList.add('filter-mode');
        menu.style.display = 'block';
        menu.style.padding = '0'; menu.style.border = 'none'; menu.style.background = 'transparent';
        const rect = btnElement.getBoundingClientRect();
        menu.style.top = (rect.bottom + 8) + 'px';
        menu.style.left = 'auto'; menu.style.right = (window.innerWidth - rect.right) + 'px';
        document.getElementById('popupOverlay').style.display = 'block';
    }
}

function filterAction(action, payload) {
    const allRoleNames = ROLES_CONFIG.map(r => r.name);
    let current = (ACTIVE_FILTER_ROLES.length === 0) ? [...allRoleNames] : [...ACTIVE_FILTER_ROLES];

    if (action === 'TOGGLE_ALL') {
        if (current.length === allRoleNames.length) current = ["__NONE__"]; else current = [];
    } else if (action === 'TOGGLE_ROLE') {
        const r = payload.role;
        if (current.includes(r)) current = current.filter(item => item !== r); else current.push(r);
    } else if (action === 'TOGGLE_GROUP') {
        const groupRoles = payload.groupRoles.split(',');
        const allChecked = groupRoles.every(r => current.includes(r));
        if (allChecked) current = current.filter(r => !groupRoles.includes(r)); else groupRoles.forEach(r => { if(!current.includes(r)) current.push(r); });
    }

    if (current.length === allRoleNames.length) ACTIVE_FILTER_ROLES = [];
    else if (current.length === 1 && current[0] === "__NONE__") ACTIVE_FILTER_ROLES = ["__NONE__"];
    else ACTIVE_FILTER_ROLES = current;

    updateFilteredData();
    const displaySelection = (ACTIVE_FILTER_ROLES.length === 0) ? allRoleNames : ACTIVE_FILTER_ROLES;
    document.querySelectorAll('.filter-chk').forEach(chk => { chk.checked = displaySelection.includes(chk.value); });
    const isAll = (displaySelection.length === allRoleNames.length);
    const btnAll = document.getElementById('btnFilterToggleAll');
    if(btnAll) { btnAll.innerText = isAll ? 'Tout décocher' : 'Tout cocher'; btnAll.onclick = () => filterAction('TOGGLE_ALL'); }
}

function updateFilteredData() {
    if (ACTIVE_FILTER_ROLES.length === 0) FILTERED_ROLES = [...ROLES_CONFIG];
    else if (ACTIVE_FILTER_ROLES.length === 1 && ACTIVE_FILTER_ROLES[0] === "__NONE__") FILTERED_ROLES = [];
    else FILTERED_ROLES = ROLES_CONFIG.filter(r => ACTIVE_FILTER_ROLES.includes(r.name));
    PAGINATION.MASTER.start = 0; PAGINATION.PIVOT.start = 0;
    refreshAllViews();
}

// --- FORMATTEUR DATE JOLI ---
function formatDateNice(dateStr) {
    // DD/MM/YYYY -> 25 JANV 2025
    if(!dateStr) return "";
    const parts = dateStr.split('/');
    const d = new Date(parts[2], parts[1]-1, parts[0]);
    // Ajout de 'year: numeric'
    return d.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', year: 'numeric'}).toUpperCase().replace('.', '');
}

function handleGlobalSearch(query) {
    const container = document.getElementById('globalSearchResults');
    if (query.length < 2) { 
        container.innerHTML = '<div class="text-center text-muted py-5 small">Tapez au moins 2 caractères</div>'; 
        return; 
    }
    
    const q = query.toLowerCase();
    let html = "";
    
    // A. RECHERCHE CULTES
    const cultHits = PLANNING_DATA.filter((e, idx) => { 
        e._tempIdx = idx; 
        return (e.titre && e.titre.toLowerCase().includes(q)); 
    });
    
    if (cultHits.length > 0) {
        html += `<div class="search-section-title">Cultes (${cultHits.length})</div>`;
        cultHits.forEach(e => {
            const niceDate = formatDateNice(e.date);
            html += `
            <div class="search-result-item" onclick="closeAllPopups(); jumpToEventIndex(${e._tempIdx})">
                <div class="d-flex align-items-center gap-3">
                    <div class="search-date-badge">${niceDate}</div>
                    <div class="fw-medium text-dark" style="font-size:14px;">${e.titre}</div>
                </div>
                <!-- CORRECTION ICONE CIBLE ICI -->
                <i class="bi bi-calendar-event text-muted opacity-50" title="Aller à cette date"></i>
            </div>`;
        });
    }
    
    // B. RECHERCHE PERSONNES
    const personHits = new Set();
    
    PLANNING_DATA.forEach(e => {
        if(e.assignments) {
            Object.values(e.assignments).forEach(nom => {
                if (nom && String(nom).toLowerCase().includes(q)) personHits.add(nom);
            });
        }
    });
    
    if(NAMES_DB) {
        NAMES_DB.forEach(nom => {
            if (nom && String(nom).toLowerCase().includes(q)) personHits.add(nom);
        });
    }
    
    const sortedPersons = Array.from(personHits).sort();
    
    if (sortedPersons.length > 0) {
        html += `<div class="search-section-title">Personnes (${sortedPersons.length})</div>`;
        sortedPersons.forEach(nom => {
            const safeNom = encodeURIComponent(nom);
            html += `
            <div class="search-result-item" onclick="closeAllPopups(); openPersonPanel(decodeURIComponent('${safeNom}'))">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-gray-100 text-secondary rounded-circle d-flex align-items-center justify-content-center fw-bold border" style="width:32px; height:32px; font-size:11px;">
                        ${nom.substring(0,2).toUpperCase()}
                    </div>
                    <div class="fw-medium text-dark" style="font-size:14px;">${nom}</div>
                </div>
                <i class="bi bi-calendar-week text-primary opacity-75" title="Voir le planning"></i>
            </div>`;
        });
    }
    
    if (html === "") html = '<div class="text-center text-muted py-5 small">Aucun résultat.</div>';
    container.innerHTML = html;
}

function handleNameFilter(query) {
    const q = query.trim();
    const qLower = q.toLowerCase();
    
    // 1. Filtrer la liste
    const matches = NAMES_DB.filter(n => n.toLowerCase().includes(qLower));
    
    // 2. Rendu de la liste
    renderNameList(matches, null);
    
    // 3. Injection Bouton Création (si pas de match exact et saisie > 2 chars)
    const exactMatch = NAMES_DB.some(n => n.toLowerCase() === qLower);
    
    if (!exactMatch && q.length >= 2) {
        const container = document.getElementById('namePopupList');
        // On l'ajoute à la fin de la liste existante
        // Style discret : Lien bleu en bas
        const btnHtml = `
            <div class="p-2 border-top mt-1 hover-bg cursor-pointer text-center" onclick="openAddPersonModal('${q.replace(/'/g, "\\'")}')">
                <span class="text-primary fw-bold small"><i class="bi bi-plus-lg me-1"></i>Créer "${q}"</span>
            </div>`;
        container.insertAdjacentHTML('beforeend', btnHtml);
    }
}

function submitNewPerson() {
    const name = window.TARGET_NEW_PERSON;
    const passInput = document.getElementById('newPersonPass');
    const pass = passInput.value;
    const btn = document.getElementById('btnConfirmAddPerson');
    const errorDiv = document.getElementById('newPersonError');
    
    // Reset erreur visuelle avant envoi
    passInput.classList.remove('shake-error');
    
    if (!pass) {
        // Petit délai pour permettre au navigateur de retirer la classe avant de la remettre (si besoin de rejouer l'anim)
        void passInput.offsetWidth; 
        passInput.classList.add('shake-error');
        return;
    }
    
    btn.innerText = "Ajout..."; btn.disabled = true;
    errorDiv.classList.add('d-none');
    
    google.script.run.withSuccessHandler(res => {
        // Même si on a fermé entre temps, ceci s'exécutera
        if (res.success) {
            // 1. Mise à jour Locale
            if (!NAMES_DB.includes(res.name)) {
                NAMES_DB.push(res.name);
                NAMES_DB.sort(); 
            }
            
            // 2. Assigner et Fermer
            saveName(res.name); 
            closeAllPopups(); // Ferme tout proprement
            showPlanningToast(res.name + " ajouté !");
            
        } else {
            // ERREUR
            // On vérifie si la modale est toujours ouverte avant de toucher à l'UI
            const modal = document.getElementById('addPersonModal');
            if(modal && modal.style.display !== 'none') {
                btn.innerText = "Confirmer"; btn.disabled = false;
                errorDiv.classList.remove('d-none');
                passInput.value = "";
                passInput.focus();
                passInput.classList.add('shake-error');
            }
        }
    }).withFailureHandler(err => {
        alert("Erreur serveur : " + err);
        btn.innerText = "Confirmer"; btn.disabled = false;
    }).addNameFromPlanning(name, pass);
}

function saveName(newName) {
    if (!TARGET_CELL_DATA) return;
    const { date, time, role } = TARGET_CELL_DATA;
    
    // Mise à jour optimiste (Interface immédiate)
    const evt = PLANNING_DATA.find(e => e.date === date && e.heure === time);
    if(evt) {
        if(!evt.assignments) evt.assignments = {};
        if(newName === "") delete evt.assignments[role];
        else evt.assignments[role] = newName;
    }
    
    refreshAllViews(true); // Rafraîchissement silencieux
    closeAllPopups();
    
    // Sauvegarde Serveur
    google.script.run.withFailureHandler(err => alert("Erreur: " + err)).updatePlanningCell(date, time, role, newName);
}

// 2. LOGIQUE PLANNING PERSONNEL (Mise à jour HERO & Scroll)
function openPersonPanel(nom) {
    document.getElementById('pspName').innerText = nom;
    const container = document.getElementById('pspContent');
    const panel = document.getElementById('personSchedulePanel');
    const overlay = document.getElementById('popupOverlay');
    
    const now = new Date().setHours(0,0,0,0);
    let groupedEvents = {};
    
    // 1. Regroupement des données
    PLANNING_DATA.forEach(e => {
        if(e.assignments) {
            for (const [role, assignedName] of Object.entries(e.assignments)) {
                if (assignedName === nom) {
                    const key = e.date + "_" + e.heure;
                    if(!groupedEvents[key]) {
                        const dObj = new Date(e.dateObj);
                        groupedEvents[key] = {
                            dateObj: e.dateObj,
                            // Formatage Date
                            dayNum: dObj.getDate(),
                            monthName: dObj.toLocaleDateString('fr-FR', {month:'short'}).replace('.',''),
                            weekDay: dObj.toLocaleDateString('fr-FR', {weekday:'long'}).replace('.',''),
                            heure: e.heure,
                            titre: e.titre || "Culte", // <--- RÉCUPÉRATION DU TITRE RÉEL
                            isPast: e.dateObj < now,
                            rolesByType: {}
                        };
                    }
                    
                    // Identification du Type de Rôle
                    let type = "AUTRE";
                    const roleConfig = ROLES_CONFIG.find(r => r.name === role);
                    if(roleConfig && roleConfig.type) type = roleConfig.type.toUpperCase();
                    
                    if(!groupedEvents[key].rolesByType[type]) groupedEvents[key].rolesByType[type] = [];
                    groupedEvents[key].rolesByType[type].push(role);
                }
            }
        }
    });
    
    let events = Object.values(groupedEvents);
    events.sort((a,b) => a.dateObj - b.dateObj);
    
    let html = "";
    if (events.length === 0) {
        html = `<div class="h-100 d-flex flex-column align-items-center justify-content-center text-muted opacity-50"><i class="bi bi-calendar-x display-4 mb-3"></i><div class="small">Aucune intervention.</div></div>`;
    } else {
        let firstFutureId = null;
        
        events.forEach((ev, idx) => {
            const cardId = `psp-card-${idx}`;
            const isFuture = !ev.isPast;
            // On capture le premier élément futur
            if(isFuture && !firstFutureId) firstFutureId = cardId;
            
            const cardClass = isFuture ? "psp-session-card is-future" : "psp-session-card is-past";
            
            // Construction des Groupes
            let groupsHtml = "";
            const typeOrder = ["LITURGIE", "MUSIQUE", "TECHNIQUE", "TRADUCTION", "AUTRE"];
            const types = Object.keys(ev.rolesByType).sort((a,b) => {
                let ia = typeOrder.indexOf(a); if(ia===-1) ia=99;
                let ib = typeOrder.indexOf(b); if(ib===-1) ib=99;
                return ia - ib;
            });
            
            types.forEach(t => {
                let rolesList = "";
                ev.rolesByType[t].forEach(r => {
                    rolesList += `<div class="psp-role-row">${r}</div>`;
                });
                
                let icon = "circle";
                if(t.includes('LIT')) icon = "book";
                if(t.includes('MUS')) icon = "music-note-beamed";
                if(t.includes('TECH')) icon = "sliders";
                
                groupsHtml += `
                <div class="psp-cat-group">
                    <div class="psp-cat-title"><i class="bi bi-${icon}"></i> ${t}</div>
                    <div>${rolesList}</div>
                </div>`;
            });
            
            html += `
            <div class="${cardClass}" id="${cardId}">
                <div class="psp-card-strip"></div>
                <div class="psp-date-box">
                    <div class="psp-weekday-top">${ev.weekDay}</div>
                    <div class="psp-d-day">${ev.dayNum}</div>
                    <div class="psp-d-month">${ev.monthName}</div>
                </div>
                <div class="psp-info-box">
                    <div class="psp-header-row border-bottom pb-2 mb-2">
                        <!-- AFFICHAGE DU TITRE RÉEL ICI -->
                        <div class="fw-bold text-dark text-truncate" style="font-size:13px; max-width: 160px;" title="${ev.titre}">${ev.titre}</div>
                        <div class="psp-time-badge"><i class="bi bi-clock me-1" style="font-size:10px;"></i>${ev.heure}</div>
                    </div>
                    <div>${groupsHtml}</div>
                </div>
            </div>`;
        });
        
        container.setAttribute('data-scroll-target', firstFutureId || "");
    }
    
    container.innerHTML = html;
    
    panel.style.display = 'flex'; 
    setTimeout(() => { panel.classList.add('open'); }, 10);
    if(overlay) { overlay.style.display = 'block'; overlay.onclick = closePersonPanel; }
    
    // --- SCROLL AUTOMATIQUE (CORRIGÉ : START) ---
    setTimeout(() => {
        const targetId = container.getAttribute('data-scroll-target');
        if (targetId) {
            const el = document.getElementById(targetId);
            if(el) {
                // block: 'start' force l'élément tout en haut
                el.scrollIntoView({behavior: 'smooth', block: 'start'});
            }
        } else {
            container.scrollTop = container.scrollHeight;
        }
    }, 300);
}

    const o = document.getElementById('popupOverlay');
    p.classList.remove('open');

function getTypeColorClassFromType(typeRaw) {
    const t = (typeRaw || "").toUpperCase();
    if(t.includes('LITURG') || t.includes('PASTEUR')) return 'th-type-liturgie';
    if(t.includes('MUSI') || t.includes('CHANT')) return 'th-type-musique';
    if(t.includes('TECH') || t.includes('SON')) return 'th-type-technique';
    if(t.includes('TRAD')) return 'th-type-traduction';
    if(t.includes('SEC') || t.includes('ADMIN')) return 'th-type-secretaire';
    return 'th-type-accueil'; 
}

function getRoleHeaderClass(roleName) {
    const roleObj = ROLES_CONFIG.find(r => r.name === roleName);
    const type = roleObj ? (roleObj.type || "").toUpperCase() : roleName.toUpperCase();
    
    // LITURGIE (Bleu)
    if(type.includes('LITURG') || roleName.includes('Mpitari')) return 'th-type-liturgie';
    
    // MUSIQUE (Vert)
    if(type.includes('MUSI') || type.includes('CHANT')) return 'th-type-musique';
    
    // TECHNIQUE (Rouge/Orange)
    if(type.includes('TECH') || type.includes('SON') || type.includes('PROJ')) return 'th-type-technique';
    
    // TRADUCTION (Violet)
    if(type.includes('TRAD')) return 'th-type-traduction';
    
    // SECRÉTAIRE (Turquoise)
    if(type.includes('SEC') || type.includes('ADMIN')) return 'th-type-secretaire';
    
    return ''; 
}

function getRoleIconClass(roleName) {
    // On cherche le type dans la config si possible, sinon on devine par le nom
    const roleObj = ROLES_CONFIG.find(r => r.name === roleName);
    const type = roleObj ? (roleObj.type || "").toUpperCase() : roleName.toUpperCase();
    
    if(type.includes('LITURG') || roleName.includes('Mpitari')) return 'bi-book';

    if(type.includes('TECH') || type.includes('SON') || type.includes('PROJ')) return 'bi-sliders';

function submitNewEvent() {
    const d = document.getElementById('newEventDate').value; // YYYY-MM-DD
    const t = document.getElementById('newEventTime').value; // HH:MM
    const title = document.getElementById('newEventTitle').value || "Culte";
    
    if(!d || !t) {
        alert("Veuillez sélectionner une date et une heure.");
        return;
    }
    
    closeAllPopups(); // Fermeture immédiate
    
    // 1. CONVERSION & OBJET LOCAL (OPTIMISTIC)
    const [yyyy, mm, dd] = d.split('-');
    const dateFr = `${dd}/${mm}/${yyyy}`;
    const dateObj = new Date(parseInt(yyyy), parseInt(mm)-1, parseInt(dd));
    
    const newEvent = {
        date: dateFr,
        heure: t,
        titre: title,
        dateObj: dateObj.getTime(),
        assignments: {} // Vide au départ
    };
    
    // 2. INSERTION DANS LES DONNÉES LOCALES
    PLANNING_DATA.push(newEvent);
    // Tri pour insérer au bon endroit chronologique
    PLANNING_DATA.sort((a,b) => a.dateObj - b.dateObj);
    
    // Si c'est un événement futur, on met à jour l'index "Prochain culte"
    const now = new Date().setHours(0,0,0,0);
    if(dateObj.getTime() >= now) {
        // On recalcule l'index du prochain culte
        NEXT_CULT_INDEX = PLANNING_DATA.findIndex(e => e.dateObj >= now);
    }
    
    // 3. RAFRAÎCHISSEMENT VISUEL IMMÉDIAT
    // On force le rendu sans toucher au serveur
    if (CURRENT_VIEW === VIEW_MODE_MASTER) {
        calculateVisibleColumns('MASTER');
        renderMasterView(document.getElementById('viewContainerMaster'));
        // Scroll vers la nouvelle date (optionnel mais sympa)
        setTimeout(() => {
            const idx = PLANNING_DATA.indexOf(newEvent);
            const row = document.getElementById(`row-master-${idx}`);
            if(row) {
                row.scrollIntoView({behavior: 'smooth', block: 'center'});
                // Petit flash visuel pour dire "C'est là !"
                row.style.transition = "background 0.5s";
                row.style.backgroundColor = "#EFF6FF";
                setTimeout(() => row.style.backgroundColor = "", 1000);
            }
        }, 100);
    } else {
        calculateVisibleColumns('PIVOT');
        renderPivotView(document.getElementById('viewContainerPivot'));
    }
    
    showPlanningToast("Culte ajouté !");
    
    // 4. SAUVEGARDE SERVEUR (BACKGROUND)
    google.script.run
        .withFailureHandler(err => {
            alert("Erreur de sauvegarde : " + err);
            // Si erreur, on pourrait retirer l'élément, mais c'est rare.
        })
        .createPlanningEvent(dateFr, t, title);
}

function changePickerMonth(delta) {

function renderCustomPicker() {
    const grid = document.getElementById('cdpGrid');
    const title = document.getElementById('cdpTitle');
    const y = CDP_CURRENT_DATE.getFullYear();
    const m = CDP_CURRENT_DATE.getMonth();
    
    // Titre
    title.innerText = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(CDP_CURRENT_DATE);
    
    grid.innerHTML = "";
    // Jours Semaine
    const days = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    days.forEach(d => grid.innerHTML += `<div class="cdp-day-head">${d}</div>`);
    
    // Scan des dates avec culte pour ce mois
    const eventsInMonth = new Set();
    PLANNING_DATA.forEach(e => {
        // e.date est JJ/MM/AAAA
        const [dd, mm, yyyy] = e.date.split('/');
        if (parseInt(mm) === m + 1 && parseInt(yyyy) === y) {
            eventsInMonth.add(parseInt(dd));
        }
    });

    // Remplissage Jours
    const firstDay = new Date(y, m, 1).getDay(); // 0=Dimanche
    const startOffset = (firstDay === 0 ? 6 : firstDay - 1); // Lundi=0
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    
    // Vides début
    for(let i=0; i<startOffset; i++) grid.innerHTML += `<div></div>`;
    
    // Jours
    for(let d=1; d<=daysInMonth; d++) {
        const hasEvent = eventsInMonth.has(d);
        let classes = "cdp-day";
        let onClick = "";
        let dot = "";
        
        if (hasEvent) {
            classes += " has-event";
            const dateStr = `${('0'+d).slice(-2)}/${('0'+(m+1)).slice(-2)}/${y}`;
            onClick = `onclick="selectPickerDate('${dateStr}')"`;
            dot = `<div class="cdp-dot"></div>`;
        }
        
        grid.innerHTML += `<div class="${classes}" ${onClick}>${d}${dot}</div>`;
    }
}

    if (idx > -1) jumpToEventIndex(idx);
    
    // Fermer

}

function renderModalCalendar() {
    const grid = document.getElementById('modalCalGrid');
    const title = document.getElementById('modalCalTitle');
    const y = MODAL_CAL_DATE.getFullYear();
    const m = MODAL_CAL_DATE.getMonth();
    
    // Date du jour pour comparaison
    const today = new Date();
    const isCurrentMonth = (today.getFullYear() === y && today.getMonth() === m);
    const todayDay = today.getDate();
    
    title.innerText = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(MODAL_CAL_DATE);
    grid.innerHTML = "";
    
    ['L','M','M','J','V','S','D'].forEach(d => grid.innerHTML += `<div class="cdp-day-head">${d}</div>`);
    
    const firstDay = new Date(y, m, 1).getDay(); 
    const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    
    for(let i=0; i<startOffset; i++) grid.innerHTML += `<div></div>`;
    
    const selectedIso = document.getElementById('newEventDate').value;
    
    for(let d=1; d<=daysInMonth; d++) {
        const currentDateStr = `${y}-${('0'+(m+1)).slice(-2)}-${('0'+d).slice(-2)}`;
        let classes = "cdp-day has-event";
        
        // Check Selected
        if (currentDateStr === selectedIso) classes += " selected";
        
        // Check Today
        if (isCurrentMonth && d === todayDay) classes += " is-today";
        
        grid.innerHTML += `<div class="${classes}" onclick="selectModalDate('${currentDateStr}')">${d}</div>`;
    }
}

function setModalDate(dateObj) {
    // 1. Stockage ISO pour le backend
    const y = dateObj.getFullYear();
    const m = ('0' + (dateObj.getMonth() + 1)).slice(-2);
    const d = ('0' + dateObj.getDate()).slice(-2);
    document.getElementById('newEventDate').value = `${y}-${m}-${d}`;
    
    // 2. Affichage Joli (ex: Dimanche 14 Janv)
    const options = { weekday: 'long', day: 'numeric', month: 'short' };
    const niceDate = dateObj.toLocaleDateString('fr-FR', options);
    // Capitalize
    document.getElementById('modalDateDisplay').innerText = niceDate.charAt(0).toUpperCase() + niceDate.slice(1);
    
    // Synchro date interne du calendrier
    MODAL_CAL_DATE = new Date(dateObj);
}

// --- GESTION HEURES ---

function selectTimeChip(time, btn) {
    document.getElementById('newEventTime').value = time;
    
    // Gestion classes
    document.querySelectorAll('.time-chip-btn').forEach(b => b.classList.remove('selected'));
    if(btn) btn.classList.add('selected');
}

function highlightTimeChip(time) {
    document.querySelectorAll('.time-chip-btn').forEach(b => {
        if(b.innerText === time) b.classList.add('selected');
        else b.classList.remove('selected');
    });
}

function resetTimeChips() {
    document.querySelectorAll('.time-chip-btn').forEach(b => b.classList.remove('selected'));
}

/* --- NOTIFICATION TOAST --- */
function showPlanningToast(msg) {
    const toast = document.getElementById('plToast');
    const txt = document.getElementById('plToastMsg');
    if(!toast || !txt) return;
    
    txt.innerText = msg;
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}
