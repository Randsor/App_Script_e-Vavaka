<script>
/**
 * MODULE EXPORT SÉPARÉ (PDF vs DOCS)
 * Le PDF reste le standard de l'application. Le Docs est réservé aux Pasteurs.
 */

// ========================================================
// 1. LOGIQUE PDF (Restaurée exactement comme à l'origine)
// ========================================================
let EXPORT_CONTEXT = {
    progId: null,
    pdfLink: null,
    downloadUrl: null,
    isGenerating: false,
    isConfirmingRegen: false
};

function openExportModal() {
    if (!currentProgData) return;
    
    EXPORT_CONTEXT.progId = currentProgData.id;
    EXPORT_CONTEXT.pdfLink = currentProgData.pdfLink || null;
    EXPORT_CONTEXT.downloadUrl = null;
    EXPORT_CONTEXT.isGenerating = false;
    EXPORT_CONTEXT.isConfirmingRegen = false;
    
    renderExportModalState();
    
    if(typeof openCustomModal === 'function') {
        openCustomModal('exportPdfModal', 'progCreatorOverlay');
    } else {
        document.getElementById('exportPdfModal').style.display = 'flex';
        document.getElementById('progCreatorOverlay').style.display = 'block';
    }
}

function renderExportModalState() {
    const container = document.getElementById('exportModalContent');
    const hasPdf = !!EXPORT_CONTEXT.pdfLink;
    let html = "";
    
    // ÉTAT 1 : GÉNÉRATION EN COURS
    if (EXPORT_CONTEXT.isGenerating) {
        html += `
        <div class="text-center py-5">
            <div class="spinner-border text-danger mb-4" style="width: 3rem; height: 3rem;" role="status"></div>
            <h5 class="fw-bold text-dark">Création du document...</h5>
            <p class="text-muted small px-4">Veuillez patienter pendant la génération du PDF.</p>
        </div>`;
    } 
    
    // ÉTAT 2 : CONFIRMATION RÉGÉNÉRATION
    else if (EXPORT_CONTEXT.isConfirmingRegen) {
        html += `
        <div class="text-center mb-4">
            <div class="bg-warning bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px; height:64px;">
                <i class="bi bi-exclamation-triangle-fill text-warning fs-1"></i>
            </div>
            <h5 class="fw-bold text-dark">Attention !</h5>
            <p class="text-muted small mb-0 px-3">
                Une version de ce programme existe déjà.<br>
                Voulez-vous l'écraser et générer un nouveau PDF ?
            </p>
        </div>
        <div class="d-grid gap-2">
            <button class="btn btn-dark" onclick="resetToInitialState()">Oui, régénérer</button>
            <button class="btn btn-light border text-secondary" onclick="cancelRegenerate()">Annuler</button>
        </div>
        `;
    }

    // ÉTAT 3 : PDF EXISTANT (Succès)
    else if (hasPdf) {
        html += `
        <div class="text-center">
            <div class="pdf-hero-icon"><i class="bi bi-file-earmark-pdf-fill"></i></div>
            <h5 class="fw-bold text-dark mb-1">Votre feuille est prête !</h5>
            <p class="text-muted small mb-4 text-truncate px-4" title="${currentProgData.titre}">${currentProgData.titre}</p>
        </div>

        <div class="pdf-success-card">
            <i class="bi bi-check-circle-fill text-success fs-5"></i>
            <div>Document généré et stocké sur Drive.</div>
        </div>
        
        <button class="btn btn-dark w-100 py-2 mb-3 shadow-sm d-flex align-items-center justify-content-center gap-2" onclick="window.open('${EXPORT_CONTEXT.pdfLink}', '_blank')">
            <i class="bi bi-eye-fill"></i> Ouvrir le PDF
        </button>
        
        <div class="action-grid">
            <button class="btn-action-card" onclick="copyPdfLink()">
                <i class="bi bi-link-45deg"></i>
                <span style="font-size:12px; font-weight:600;">Copier le lien</span>
            </button>
            <button class="btn-action-card" onclick="downloadPdfDirectly()">
                <i class="bi bi-download"></i>
                <span style="font-size:12px; font-weight:600;">Télécharger</span>
            </button>
        </div>
        
        <div class="danger-zone">
            <button class="btn btn-link text-secondary text-decoration-none btn-sm d-flex align-items-center justify-content-center gap-2 mx-auto" onclick="askConfirmationRegen()" style="font-size:11px;">
                <i class="bi bi-arrow-clockwise"></i> Régénérer une nouvelle version
            </button>
        </div>`;
    } 
    
    // ÉTAT 4 : INITIAL (Pas de PDF)
    else {
        html += `
        <div class="text-center mb-4">
            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px; height:64px;">
                <i class="bi bi-magic text-secondary fs-2"></i>
            </div>
            <h5 class="fw-bold m-0 text-dark">Générer la feuille de culte</h5>
            <p class="small text-muted mt-1">Créez un PDF propre basé sur votre modèle.</p>
        </div>

        <div class="mb-4">
            <label class="form-check p-3 border rounded bg-white d-flex align-items-center gap-3 cursor-pointer transition-all hover-bg-light">
                <input class="form-check-input mt-0" type="checkbox" id="chkIncludeTrans" checked style="width: 1.2em; height: 1.2em;">
                <div>
                    <div class="fw-bold text-dark" style="font-size:13px;">Inclure les traductions</div>
                    <div class="text-muted" style="font-size:11px;">Ajoute les textes français (italique) sous le malgache.</div>
                </div>
            </label>
        </div>
        
        <div class="d-grid">
            <button class="btn btn-danger py-2 shadow-sm" onclick="triggerGeneration()">
                <span class="fw-bold">Lancer la génération</span>
            </button>
        </div>`;
    }
    
    container.innerHTML = html;
}

function askConfirmationRegen() {
    EXPORT_CONTEXT.pdfLink = null;
    EXPORT_CONTEXT.isConfirmingRegen = false;
    EXPORT_CONTEXT.isGenerating = false;
    renderExportModalState();
}

function resetToInitialState() {
    EXPORT_CONTEXT.pdfLink = null;
    EXPORT_CONTEXT.isConfirmingRegen = false;
    EXPORT_CONTEXT.isGenerating = false;
    renderExportModalState();
}

function cancelRegenerate() {
    EXPORT_CONTEXT.isConfirmingRegen = false;
    renderExportModalState();
}

function triggerGeneration() {
    const chk = document.getElementById('chkIncludeTrans');
    const includeTrans = chk ? chk.checked : true;
    
    EXPORT_CONTEXT.isGenerating = true;
    EXPORT_CONTEXT.isConfirmingRegen = false;
    renderExportModalState();
    
    google.script.run
        .withSuccessHandler(res => {
            EXPORT_CONTEXT.isGenerating = false;
            if (res.success) {
                EXPORT_CONTEXT.pdfLink = res.url;
                EXPORT_CONTEXT.downloadUrl = res.downloadUrl;
                if(currentProgData) currentProgData.pdfLink = res.url;
                const btnDash = document.querySelector('.btn-pdf-hero');
                if(btnDash) btnDash.classList.remove('disabled');
                
                renderExportModalState();
                showNotionToast("PDF généré avec succès !", "success");
            } else {
                showErrorState(res.error, 'PDF');
            }
        })
        .withFailureHandler(err => {
            EXPORT_CONTEXT.isGenerating = false;
            showErrorState(err.message, 'PDF');
        })
        .generateProgrammePDF(EXPORT_CONTEXT.progId, includeTrans);
}

function copyPdfLink() {
    if(EXPORT_CONTEXT.pdfLink) {
        navigator.clipboard.writeText(EXPORT_CONTEXT.pdfLink).then(() => {
            showNotionToast("Lien copié !", "success");
        }).catch(err => prompt("Copiez le lien ci-dessous :", EXPORT_CONTEXT.pdfLink));
    }
}

function downloadPdfDirectly() {
    if(EXPORT_CONTEXT.downloadUrl) window.open(EXPORT_CONTEXT.downloadUrl, '_blank');
    else if (EXPORT_CONTEXT.pdfLink) window.open(EXPORT_CONTEXT.pdfLink, '_blank');
}


// ========================================================
// 2. LOGIQUE DOCS (Nouvelle modale sécurisée Pasteur)
// ========================================================
let DOCS_CONTEXT = {
    docLink: null,
    isGenerating: false,
    isConfirmingRegen: false,
    isUnlocked: false
};

function openDocsModal() {
    if (!currentProgData) return;
    
    // Le lien Docs est maintenant chargé nativement depuis la BDD (Colonne K)
    DOCS_CONTEXT.docLink = currentProgData.docLink || null;
    DOCS_CONTEXT.isGenerating = false;
    DOCS_CONTEXT.isConfirmingRegen = false;
    DOCS_CONTEXT.isUnlocked = false; // Toujours verrouillé à l'ouverture par sécurité
    
    renderDocsModalState();
    
    if(typeof openCustomModal === 'function') {
        openCustomModal('exportDocsModal', 'progCreatorOverlay');
    } else {
        document.getElementById('exportDocsModal').style.display = 'flex';
        document.getElementById('progCreatorOverlay').style.display = 'block';
    }
}

function renderDocsModalState() {
    const container = document.getElementById('docsModalContent');
    const hasDoc = !!DOCS_CONTEXT.docLink;
    let html = "";
    
    // Header permanent de la modale Docs
    html += `
    <div class="text-center mb-4">
        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width:50px; height:50px;">
            <i class="bi bi-file-earmark-word-fill fs-3"></i>
        </div>
        <h5 class="fw-bold m-0 text-dark">Google Docs</h5>
        <p class="small text-muted mt-1 mb-0">Génération d'un format G.Docs modifiable</p>
    </div>`;

    // ÉTAT 0 : VERROUILLÉ
    if (!DOCS_CONTEXT.isUnlocked) {
        html += `
        <div class="bg-light border rounded p-4 text-center">
            <i class="bi bi-shield-lock text-muted fs-2 mb-2 d-block"></i>
            <p class="small text-muted mb-3">L'accès au fichier source est protégé par mot de passe.</p>
            <div class="mb-3">
                <input type="password" id="pastorCodeInput" class="form-control text-center fw-bold pass-mask" placeholder="Code secret..." style="letter-spacing: 2px;" onkeydown="if(event.key === 'Enter') unlockDocsLink(this)">
            </div>
            <button class="btn btn-primary w-100 fw-bold" onclick="unlockDocsLink(this)">Déverrouiller</button>
        </div>`;
    }
    // ÉTAT 1 : GÉNÉRATION EN COURS
    else if (DOCS_CONTEXT.isGenerating) {
        html += `
        <div class="text-center py-4 bg-light border rounded">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <h6 class="fw-bold text-primary">Création du document...</h6>
            <p class="text-muted small px-3">Ne fermez pas cette fenêtre.</p>
        </div>`;
    }
    // ÉTAT 2 : AVERTISSEMENT DE RÉGÉNÉRATION (DESTRUCTIF)
    else if (DOCS_CONTEXT.isConfirmingRegen) {
        html += `
        <div class="bg-danger bg-opacity-10 border border-danger border-opacity-25 rounded p-3 text-center animation-fade-in">
            <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-2 d-block"></i>
            <h6 class="text-danger fw-bold mb-2">Remplacement définitif</h6>
            <p class="small text-dark mb-4 lh-sm">Si vous avez fait des modifications manuelles dans le document Google Docs actuel, <strong>elles seront perdues</strong>.</p>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-light border flex-grow-1" onclick="cancelDocRegen()">Annuler</button>
                <button class="btn btn-sm btn-danger flex-grow-1 fw-bold" onclick="triggerDocGeneration()">Oui, Écraser</button>
            </div>
        </div>`;
    }
    // ÉTAT 3 : DOCUMENT EXISTANT
    else if (hasDoc) {
        html += `
        <div class="bg-primary bg-opacity-10 border border-primary border-opacity-25 rounded p-4 text-center">
            <p class="small text-primary fw-medium mb-3 lh-sm"><i class="bi bi-info-circle-fill me-1"></i>Ce document n'est pas synchronisé avec e-Vavaka | Toute modification de l'un ne modifiera pas l'autre</p>
            <button class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3" onclick="window.open('${DOCS_CONTEXT.docLink}', '_blank')">
                <i class="bi bi-pencil-square me-2"></i> Éditer le Document
            </button>
            <hr class="opacity-25 my-3">
            <button class="btn btn-link text-danger text-decoration-none btn-sm p-0 w-100" onclick="askConfirmDocRegen()">
                <i class="bi bi-arrow-clockwise me-1"></i> Régénérer le document G.Docs
            </button>
        </div>`;
    }
    // ÉTAT 4 : CRÉATION INITIALE
    else {
        html += `
        <div class="bg-light border rounded p-3 mb-3">
            <label class="form-check d-flex align-items-center gap-3 cursor-pointer m-0">
                <input class="form-check-input mt-0" type="checkbox" id="chkIncludeTransDocs" checked>
                <div>
                    <div class="fw-bold text-dark" style="font-size:13px;">Inclure les traductions</div>
                </div>
            </label>
        </div>
        <button class="btn btn-primary w-100 py-2 shadow-sm fw-bold" onclick="triggerDocGeneration()">
            Générer le document éditable
        </button>
        `;
    }

    container.innerHTML = html;
}

function unlockDocsLink(btnElement) {
    const input = document.getElementById('pastorCodeInput');
    const code = input.value;
    
    if (!code) { 
        input.classList.add('shake-error'); 
        setTimeout(() => input.classList.remove('shake-error'), 500); 
        return; 
    }
    
    const originalText = btnElement.innerText;
    btnElement.innerText = "..."; 
    btnElement.disabled = true;
    
    google.script.run.withSuccessHandler(isValid => {
        if(isValid) {
            DOCS_CONTEXT.isUnlocked = true;
            renderDocsModalState();
        } else {
            btnElement.innerText = originalText; 
            btnElement.disabled = false;
            input.value = ""; 
            input.classList.add('shake-error');
            setTimeout(() => input.classList.remove('shake-error'), 500);
        }
    }).verifyPastorOrAdminCode(code);
}

function triggerDocGeneration() {
    const chk = document.getElementById('chkIncludeTransDocs');
    const includeTrans = chk ? chk.checked : true;
    
    DOCS_CONTEXT.isGenerating = true;
    DOCS_CONTEXT.isConfirmingRegen = false; 
    renderDocsModalState();
    
    google.script.run.withSuccessHandler(res => {
        DOCS_CONTEXT.isGenerating = false;
        if (res.success) {
            DOCS_CONTEXT.docLink = res.docUrl;
            if(currentProgData) currentProgData.docLink = res.docUrl;
            renderDocsModalState();
            showNotionToast("Document Word/Docs généré !", "success");
        } else {
            showErrorState(res.error, 'DOCS');
        }
    }).withFailureHandler(err => { 
        DOCS_CONTEXT.isGenerating = false; 
        showErrorState(err.message, 'DOCS'); 
    }).generateProgrammeDocs(currentProgData.id, includeTrans);
}

function askConfirmDocRegen() { 
    DOCS_CONTEXT.isConfirmingRegen = true; 
    renderDocsModalState(); 
}

function cancelDocRegen() { 
    DOCS_CONTEXT.isConfirmingRegen = false; 
    renderDocsModalState(); 
}

// ========================================================
// 3. UTILITAIRE GLOBAL D'ERREURS
// ========================================================
function showErrorState(msg, targetContext) {
    const containerId = targetContext === 'DOCS' ? 'docsModalContent' : 'exportModalContent';
    const container = document.getElementById(containerId);
    if(container) {
        container.innerHTML = `
            <div class="text-center py-4">
                <div class="bg-danger bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px; height:64px;">
                    <i class="bi bi-x-lg text-danger fs-3"></i>
                </div>
                <h6 class="fw-bold text-danger mb-2">Erreur de génération</h6>
                <p class="small text-muted mb-4 px-3" style="line-height:1.4;">${msg}</p>
                <button class="btn btn-outline-dark px-4 btn-sm" onclick="${targetContext === 'DOCS' ? 'renderDocsModalState()' : 'resetError()'}">Retour</button>
            </div>
        `;
    }
}

function resetError() {
    EXPORT_CONTEXT.isGenerating = false;
    renderExportModalState();
}
</script>
